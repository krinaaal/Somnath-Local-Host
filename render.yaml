# Render Blueprint Specification for 100% Free, Permanently Active Static Site
# Static sites on Render NEVER sleep, NEVER spin down, and have zero cold starts.

services:
  - type: web
    name: somnath-local-host
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
